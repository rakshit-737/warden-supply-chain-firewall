# Warden X policy: staging (balanced).
#
# Blocks high-confidence malicious evidence (confidence >= 0.8), install-time execution hooks and
# known-exploited (CISA KEV) vulnerabilities; critical and high vulnerabilities and heuristic
# observations warn. The block threshold is slightly higher than production so pre-release
# validation is not stopped by borderline risk scores.
#
# IOC_MATCH, critical ATTACK_CHAIN (confidence >= 0.9) and HASH_MISMATCH block regardless of this
# file; exceptions and the allowlist cannot waive them.
apiVersion: warden.dev/v1
kind: Policy
metadata:
  name: staging-balanced
  environment: staging
spec:
  thresholds:
    warn: 40
    block: 75
  min_package_age_days: 0
  deny:
    packages: []
    codes:
      - IOC_MATCH
      - BROWSER_CREDENTIAL_ACCESS
    categories:
      - malicious_behavior
      - attack_chain
      - ioc
      - dependency_confusion
    capabilities:
      - install_hook_exec
      - ioc
    vulnerabilities:
      known_exploited: true
    min_confidence: 0.8
  warn:
    codes: []
    categories:
      - install_time_execution
      - obfuscation
      - credential_access
      - typosquatting
      - suspicious_artifact
      - behavior_drift
    capabilities: []
    vulnerabilities:
      min_severity: high
    min_confidence: 0.6
  require:
    provenance: null
    hash_verified: false
    sbom: false
  allow:
    packages: []
  exceptions: []
