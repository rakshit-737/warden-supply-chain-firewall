services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: warden
      POSTGRES_PASSWORD: warden
      POSTGRES_DB: warden
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warden"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-please-override-with-a-long-random-secret-value-1234}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@warden.io}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-ChangeMe_Warden!2026}
      DATABASE_URL: postgresql+psycopg://warden:warden@db:5432/warden
      REDIS_URL: redis://cache:6379/0
      REDIS_OPTIONAL: "false"
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    # Read-only root filesystem: the analyzer never needs to write outside /tmp. This is a
    # defence-in-depth control given it processes untrusted package archives.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
