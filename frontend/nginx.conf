# Warden dashboard: static SPA + reverse proxy for the API.
#
# Installed as /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged, which includes it inside
# its http {} block, so the directives above `server` are http-level. nginx runs as UID 101 and keeps
# its pid and temp files under /tmp, so the container can run with a read-only root filesystem
# (docker-compose.yml mounts tmpfs there).

server_tokens off;

# Docker's embedded DNS server (present on user-defined networks such as Compose's). nginx uses it to
# re-resolve `api` while running; `valid=10s` caps how long an answer is reused.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Keep-alive connections to the API. uvicorn runs with --timeout-keep-alive 75, longer than the 60s
# used here, so nginx always retires an idle connection before uvicorn closes it.
#
# `resolve` (open-source nginx 1.27.3 and later) makes nginx look `api` up at runtime instead of once
# at startup, so:
#   - a recreated api container is reached at its new address without restarting web;
#   - with `docker compose up --scale api=N` every replica becomes a peer;
#   - web starts while api is not running (no "host not found in upstream" at startup); API requests
#     get 502 until the name resolves.
# `resolve` requires the shared-memory zone.
upstream warden_api {
    zone warden_api 64k;
    server api:8000 resolve;
    keepalive 16;
    keepalive_timeout 60s;
}

# Header policy lives in maps so that every location inherits a single add_header set: nginx drops
# inherited add_header directives in any block that declares its own, so no location below uses one.
#
# CSP: the dashboard policy is identical to the <meta> policy that frontend/vite.config.ts injects into
# index.html at build time. Browsers enforce every policy they receive, so a looser header would change
# nothing and would only suggest the app may use inline styles or data: URIs; it may not. React and
# Recharts set styles through the CSSOM, which `style-src 'self'` permits. The header adds
# frame-ancestors, which a <meta> policy cannot express. /api/ responses get the API's own, stricter
# policy (keep it in sync with API_CSP in backend/app/api/middleware.py).
map $uri $warden_csp {
    ~^/api/  "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    default  "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; worker-src 'self'; frame-ancestors 'none'";
}

# Caching: API responses are never stored (tokens, verdicts, audit data); content-hashed Vite bundles
# are immutable; everything else, index.html included, is revalidated so a new deploy takes effect at
# once. The status is part of the key so that a missing asset (404) is never marked immutable.
map "$status:$uri" $warden_cache_control {
    "~^[0-9]+:/api/"        "no-store";
    "~^(200|304):/assets/"  "public, max-age=31536000, immutable";
    default                 "no-cache";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects never leak the container port when it is published elsewhere.
    absolute_redirect off;
    autoindex off;
    charset utf-8;

    # The API itself also caps bodies (MAX_REQUEST_BODY_BYTES, 4 MiB by default).
    client_max_body_size 5m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    # Security headers on every response, errors included ("always").
    add_header Content-Security-Policy $warden_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $warden_cache_control always;

    # Compression for static content only (disabled again for /api/).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ---- API reverse proxy --------------------------------------------------------------------
    # The client address is forwarded as a single hop (any client-supplied X-Forwarded-For is
    # replaced). The API honours X-Forwarded-* only from this container's fixed address
    # (TRUSTED_PROXY_IPS / FORWARDED_ALLOW_IPS in docker-compose.yml). If another proxy or load
    # balancer sits in front of this one, configure the realip module here so $remote_addr is the
    # real client, and pass on that proxy's X-Forwarded-Proto.
    location ^~ /api/ {
        proxy_pass http://warden_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # Package scans run synchronously for up to SCAN_TIMEOUT_SECONDS (300s by default).
        proxy_read_timeout 330s;

        # API responses mix secrets (tokens) with attacker-influenced text, the precondition for
        # BREACH-style compression oracles, so they are never compressed here.
        gzip off;

        # nginx sets these headers itself (above); drop the API's copies so none is duplicated.
        # Strict-Transport-Security from the API passes through unchanged.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cache-Control;
    }

    # Container image uploads: the only route that accepts large bodies (the API enforces
    # MAX_IMAGE_UPLOAD_BYTES, 256 MiB by default, and checks authorisation before reading the body).
    # The body is streamed to the API rather than buffered to disk here, and the analysis can take up
    # to CONTAINER_SCAN_TIMEOUT_SECONDS (900s). proxy_set_header / proxy_hide_header are not
    # inherited by a location that sets its own, so the full set is repeated.
    location = /api/v1/containers/scans {
        client_max_body_size 256m;
        client_body_timeout 120s;
        proxy_request_buffering off;

        proxy_pass http://warden_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 960s;
        gzip off;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cache-Control;
    }

    # Release diffs and on-demand monitoring checks analyse up to two releases in one request.
    location ~ ^/api/v1/(diffs|monitoring/packages/[^/]+/check)$ {
        proxy_pass http://warden_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 660s;
        gzip off;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cache-Control;
    }

    # Liveness and readiness probes are not exposed through this public entry point. The container
    # healthchecks call them on 127.0.0.1:8000 inside the api container. The API exempts every
    # /api/v1/health path from rate limiting, and each /ready call queries the database and reports
    # which dependencies are up, so an unauthenticated client must not reach them. As the longer
    # `^~` prefix, this location wins over /api/ for every path starting with /api/v1/health.
    location ^~ /api/v1/health {
        return 404;
    }

    # Prometheus scrapes the api containers on the internal metrics network; the metrics endpoint is
    # never exposed through this public entry point.
    location = /metrics {
        return 404;
    }

    # Container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve dotfiles.
    location ~ /\. {
        return 404;
    }

    # Content-hashed Vite bundles: long-lived cache; a missing asset is a 404, never index.html.
    location /assets/ {
        limit_except GET {
            deny all;
        }
        try_files $uri =404;
    }

    # SPA: existing files are served as-is; any other path renders the application shell.
    location / {
        limit_except GET {
            deny all;
        }
        try_files $uri /index.html;
    }
}
