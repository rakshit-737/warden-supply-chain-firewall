# Publishes Warden to PyPI when you push a version tag (e.g. `git tag v1.0.0 && git push --tags`).
#
# One-time setup before this will publish anything:
#   1. Create the project owner side on PyPI:
#        https://pypi.org/manage/account/publishing/  →  add a "pending" trusted publisher:
#        PyPI project name: warden-supply-chain-firewall
#        Owner: rakshit-737   Repository: warden-supply-chain-firewall
#        Workflow name: publish.yml   Environment: pypi
#   2. In this repo: Settings → Environments → create an environment named `pypi`.
#   3. In this repo: Settings → Secrets and variables → Actions → Variables →
#        add a repository variable  PYPI_PUBLISH = true
#
# Until PYPI_PUBLISH is "true" the publish job is SKIPPED (neutral, never red), so tagging
# a release before you've done the PyPI setup won't produce a failing check.

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing — no API token needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
