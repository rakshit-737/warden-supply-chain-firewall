# Builds the project website for GitHub Pages: the static landing page (website/) at the root and the
# documentation site (MkDocs Material) under /docs/.
# Build dependencies are installed from a hash-locked file (docs/site-requirements/requirements.txt,
# generated with `uv pip compile --generate-hashes` from requirements.in). Pull requests only build.

name: Docs

on:
  push:
    branches: [main]
    paths: [docs/**, website/**, mkdocs.yml, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, website/**, mkdocs.yml, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install MkDocs (hash-locked)
        run: python -m pip install --require-hashes --no-deps -r docs/site-requirements/requirements.txt

      - name: Build docs (strict)
        run: python -m mkdocs build --strict --site-dir site/docs

      - name: Add landing page
        run: cp -r website/. site/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
