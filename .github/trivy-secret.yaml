# Trivy secret-scanner configuration. The trivy-fs job in .github/workflows/security.yml passes it with
# --secret-config. Key names were checked against Trivy v0.74.0 (pkg/fanal/secret/scanner.go, Config).
#
# Trivy's built-in allow rule "tests" skips every path matching (^(?i)test|/test|-test|_test|\.test),
# which covers all of backend/tests/. .gitleaks.toml allowlists backend/tests/ because it holds
# synthetic credentials, so with the built-in rule active no secret scanner would read those files at
# all. Disabling the rule makes Trivy scan them. Findings there are expected to be the synthetic test
# fixtures and are triaged in code scanning; anything that looks live must be rotated and removed.
#
# Trivy silently falls back to its defaults when this file is missing, so security.yml checks that it
# exists before scanning.
disable-allow-rules:
  - tests
