[project]
name = "warden-backend"
version = "1.0.0"
description = "Warden — a behavioural software supply-chain firewall"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Security linting is handled separately by bandit (see CI), so ruff's flake8-bandit ("S")
# and the cosmetic pyupgrade ("UP") groups are intentionally not enabled here.
select = ["E", "F", "I", "B"]
ignore = ["B008", "B905"]  # Depends() default and zip() strict= are idiomatic here.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
